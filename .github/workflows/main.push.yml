name: Build and Push to AWS ECR

on:
  push:
    branches: [main, prod]

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: >-
      ${{ ((github.event_name == 'pull_request' && github.base_ref == 'prod') ||
          (github.event_name == 'push' && github.ref_name == 'prod')) &&
          'prod' || 'staging' }}
    env:
      AWS_REGION: eu-central-1

    steps:
      - name: Show vars.ENVIRONMENT
        run: echo ${{ vars.ENVIRONMENT }}

      - uses: actions/checkout@v5

      - name: Read package version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build, tag, and push with cache
        uses: docker/build-push-action@v7
        with:
          context: .
          target: prod
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ vars.REPOSITORY_NAME }}:${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
