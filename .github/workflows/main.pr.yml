name: Pre build

on:
  pull_request:
    branches: [main, prod]

jobs:
  pre-build:
    runs-on: ubuntu-latest
    environment: >-
      ${{ ((github.event_name == 'pull_request' && github.base_ref == 'prod') ||
          (github.event_name == 'push' && github.ref_name == 'prod')) &&
          'prod' || 'staging' }}
    strategy:
      matrix:
        node-version: [24.x, 26.x]

    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - run: npm ci

      - run: npm run lint

      - run: npm run format

      - run: npm test
